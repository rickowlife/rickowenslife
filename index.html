        .link-btn::before {

    <script>
        const enterScreen = document.getElementById("enterScreen");
        const bgMusic = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");
        let isPlaying = false;

        bgMusic.volume = 0.5;

        enterScreen.addEventListener("click", () => {
            enterScreen.style.display = "none";
            bgMusic.play().catch(err => console.log(err));
            isPlaying = true;
            typeEffect();
        });

        musicBtn.addEventListener("click", () => {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.textContent = "sound: off";
                isPlaying = false;
            } else {
                bgMusic.play();
                musicBtn.textContent = "sound: on";
                isPlaying = true;
            }
        });

        const fullText = "rick owens ebet all world^^ sub my tgk)))\nits my bio\ni fuck you all))\ni like women";
        let charIndex = 0;
        const typeElement = document.getElementById("typewriter");

        function typeEffect() {
            if (charIndex < fullText.length) {
                typeElement.textContent += fullText.charAt(charIndex);
                charIndex++;
                setTimeout(typeEffect, 45);
            }
        }

        const canvas = document.getElementById("ashCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 65;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.5 + 1,
                speedY: Math.random() * 1.2 + 0.4,
                speedX: Math.random() * 0.8 - 0.4,
    opacity: Math.random() * 0.6 + 0.2
            });
        }

        function animateAsh() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                ctx.fillStyle = `rgba(220, 220, 220, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y += p.speedY;
                p.x += p.speedX + Math.sin(p.y * 0.01) * 0.3;

                if (p.y > canvas.height) {
                    p.y = -5;
                    p.x = Math.random() * canvas.width;
                }
                if (p.x > canvas.width) p.x = 0;
                if (p.x < 0) p.x = canvas.width;
            });

            requestAnimationFrame(animateAsh);
        }
        animateAsh();
    </script>
